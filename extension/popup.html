<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WebSage</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <div class="header">
        🤖 WebSage-AI
    </div>

    <div class="page-info">

        <h4>Current Page</h4>

        <div id="title"></div>

        <div id="url"></div>

    </div>

    <div id="chat-container"></div>

    <div class="footer">

        <input
            id="question"
            type="text"
            placeholder="Ask anything about this webpage..."
        >

        <button id="sendBtn">
            Send
        </button>

    </div>

</div>

<script src="popup.js"></script>

</body>

</html>
